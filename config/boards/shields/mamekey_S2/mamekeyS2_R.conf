#Log -------------------
# CONFIG_ZMK_USB_LOGGING=y

# 以下ターミナル操作
# ls /dev/cu.*
# でusbmodemを調べる。下のusbmodem1101のところに調べたやつを入れる。
# tio /dev/cu.usbmodem1101

#Bluetooth config -------------------
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

CONFIG_ZMK_USB=y

#Mouse config ---------------------
CONFIG_PMW3610_ALT_INVERT_X=y
# CONFIG_PMW3610_ALT_INVERT_Y=y
# CONFIG_PMW3610_SWAP_XY=y
# CONFIG_PMW3610_REPORT_INTERVAL_MIN=12
# CONFIG_PMW3610_LOG_LEVEL_DBG=y
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=300
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=20

#zmk stack sizes ---------------------
CONFIG_INPUT_THREAD_STACK_SIZE=4096

#spi ---------------------
# CONFIG_SPI_ASYNC=n
# CONFIG_SPI_NRFX_RAM_BUFFER_SIZE=32
# CONFIG_SPI_NRFX=y

CONFIG_WATCHDOG=y

#Encoder config -------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_BT_BAS=y

#ZMK Studio config -------------------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

#Layer LED config -------------------
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_INTERVAL_MS=250
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_CHANGE=n

CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
#num_cyan
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=6
#sym_yellow
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=3
#macarrow_magenta
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=5
#jis_white
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=7
#jisnum_cyan
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=6
#jissys_yellow
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=3
#winarrow_magenta
CONFIG_RGBLED_WIDGET_LAYER_7_COLOR=5
#BT_blue
CONFIG_RGBLED_WIDGET_LAYER_8_COLOR=4
#mouse_red
CONFIG_RGBLED_WIDGET_LAYER_9_COLOR=1
#mouse2_red
CONFIG_RGBLED_WIDGET_LAYER_10_COLOR=1
#mouse3_red
CONFIG_RGBLED_WIDGET_LAYER_11_COLOR=1
#wmouse_red
CONFIG_RGBLED_WIDGET_LAYER_12_COLOR=1
#wmouse2_red
CONFIG_RGBLED_WIDGET_LAYER_13_COLOR=1
#wmouse3_red
CONFIG_RGBLED_WIDGET_LAYER_14_COLOR=1
#scroll_red
CONFIG_RGBLED_WIDGET_LAYER_15_COLOR=1
#fastscroll_red
CONFIG_RGBLED_WIDGET_LAYER_16_COLOR=1

#KEY Bounde config -------------------
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5


#Prospector config -------------------
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="mamekeyS"  # Display name

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_BATTERY_REPORTING=y

CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=200
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=10000
CONFIG_ZMK_STATUS_ADV_ACTIVITY_TIMEOUT_MS=120000

# Touch Panel Support - ENABLE for touch mode
CONFIG_PROSPECTOR_TOUCH_ENABLED=y

# Layer Display - Increase for touch mode adjustability
CONFIG_PROSPECTOR_MAX_LAYERS=10

# (Optional) Central side selection for split keyboards
#CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="RIGHT"  # or "RIGHT" (default)

# (Optional) Enable ambient light sensor if you have APDS9960
# CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=y

# (Optional) Enable battery support if you have LiPo connected
# CONFIG_PROSPECTOR_BATTERY_SUPPORT=y
